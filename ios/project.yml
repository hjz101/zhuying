name: Yueshan
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.12.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Fuzi:
    url: https://github.com/cezheng/Fuzi.git
    exactVersion: 3.1.3
  LibArchive:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
options:
  bundleIdPrefix: com.yueshan
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.8.0'
    CURRENT_PROJECT_VERSION: '8'
    YUESHAN_SOURCE_REVISION: unrecorded
targets:
  Yueshan:
    type: application
    platform: iOS
    dependencies:
      - package: GRDB
      - package: ZIPFoundation
      - package: Fuzi
      - package: LibArchive
        product: libarchive
    info:
      path: Yueshan/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        YueshanSourceRevision: $(YUESHAN_SOURCE_REVISION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: 用于连接您在书源网络配置中指定的局域网代理或 DNS 服务。
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.yueshan.import
            CFBundleURLSchemes: [yueshan]
    sources:
      - path: Yueshan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yueshan.reader.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 阅山
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  YueshanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YueshanTests
      - path: YueshanTestSupport
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  YueshanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YueshanUITests
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  YueshanLiveAcceptanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YueshanLiveAcceptanceUITests
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  YueshanPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YueshanPerformanceTests
      - path: YueshanTestSupport
      - path: YueshanTests/Fixtures/ReaderTestFont.ttf
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  YueshanPerformanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YueshanPerformanceUITests
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yueshan Live Acceptance:
    build:
      targets:
        Yueshan: all
    test:
      targets:
        - YueshanLiveAcceptanceUITests
  Yueshan Performance:
    build:
      targets:
        Yueshan: all
    test:
      targets:
        - YueshanPerformanceTests
        - YueshanPerformanceUITests
  Yueshan Production:
    build:
      targets:
        Yueshan: all
    run:
      commandLineArguments:
        --production: true
  Yueshan:
    build:
      targets:
        Yueshan: all
    test:
      gatherCoverageData: true
      targets:
        - YueshanTests
        - YueshanUITests
