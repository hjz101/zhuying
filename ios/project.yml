name: Zhuying
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.12.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Fuzi:
    url: https://github.com/cezheng/Fuzi.git
    exactVersion: 3.1.3
  LibArchive:
    url: https://github.com/matteo-pacini/libarchive-for-swift.git
    exactVersion: 1.0.0
options:
  bundleIdPrefix: com.zhuying
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.8.0'
    CURRENT_PROJECT_VERSION: '9'
    ZHUYING_SOURCE_REVISION: unrecorded
targets:
  ZhuyingScriptCore:
    type: library.static
    platform: iOS
    sources:
      - path: ZhuyingScriptCore
      - path: Vendor/QuickJS/quickjs.c
      - path: Vendor/QuickJS/libregexp.c
      - path: Vendor/QuickJS/libunicode.c
      - path: Vendor/QuickJS/cutils.c
      - path: Vendor/QuickJS/dtoa.c
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: ZhuyingScriptCore
        MODULEMAP_FILE: $(SRCROOT)/ZhuyingScriptCore/include/module.modulemap
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/QuickJS
          - $(SRCROOT)/ZhuyingScriptCore/include
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - CONFIG_VERSION=\"2026-06-04\"
  Zhuying:
    type: application
    platform: iOS
    dependencies:
      - target: ZhuyingScriptCore
      - package: GRDB
      - package: ZIPFoundation
      - package: Fuzi
      - package: LibArchive
        product: libarchive
    info:
      path: Zhuying/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ZhuyingSourceRevision: $(ZHUYING_SOURCE_REVISION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: 用于连接您在书源网络配置中指定的局域网代理或 DNS 服务。
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.zhuying.import
            CFBundleURLSchemes: [zhuying, yueshan]
    sources:
      - path: Zhuying
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuying.reader.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 竹影
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ZhuyingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhuyingTests
      - path: ZhuyingTestSupport
    dependencies:
      - target: Zhuying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ZhuyingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZhuyingUITests
    dependencies:
      - target: Zhuying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ZhuyingLiveAcceptanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZhuyingLiveAcceptanceUITests
    dependencies:
      - target: Zhuying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ZhuyingPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhuyingPerformanceTests
      - path: ZhuyingTestSupport
      - path: ZhuyingTests/Fixtures/ReaderTestFont.ttf
    dependencies:
      - target: Zhuying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ZhuyingPerformanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZhuyingPerformanceUITests
    dependencies:
      - target: Zhuying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zhuying Live Acceptance:
    build:
      targets:
        Zhuying: all
    test:
      targets:
        - ZhuyingLiveAcceptanceUITests
  Zhuying Performance:
    build:
      targets:
        Zhuying: all
    test:
      targets:
        - ZhuyingPerformanceTests
        - ZhuyingPerformanceUITests
  Zhuying Production:
    build:
      targets:
        Zhuying: all
    run:
      commandLineArguments:
        --production: true
  Zhuying:
    build:
      targets:
        Zhuying: all
    test:
      gatherCoverageData: true
      targets:
        - ZhuyingTests
        - ZhuyingUITests
