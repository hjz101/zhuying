 function readingBehavior(){

 function operationScreen(){
  const b=readingBehavior(),t=theme();
  const options=b.axis==='horizontal'?['平移','覆盖','仿真','无动画']:['平移','覆盖','无动画'];
  const effectLabels={平移:b.axis==='horizontal'?'整页水平移动':'整页垂直移动',覆盖:'新的一页盖住当前页',仿真:'模拟纸张卷页',无动画:'立即切换到下一页'};

 function demonstrateTurn(direction=1){
  if(motionBusy)return;
  const front=root.querySelector('[data-front]'),back=root.querySelector('[data-back-page]'),status=root.querySelector('[data-motion-status]');
  if(!front||!back)return;
  const behavior=readingBehavior(),target=Math.max(1,motionPage+direction),version=demoVersion;
  back.innerHTML=samplePage(target);back.style.zIndex=behavior.effect==='覆盖'?'3':'1';
  const finish=()=>{if(version!==demoVersion)return;motionPage=target;front.innerHTML=samplePage(motionPage);front.style.transformOrigin='';back.style.zIndex='1';motionBusy=false;if(status)status.textContent=behavior.paged?'已翻到第 '+motionPage+' 页 · '+behavior.effect:'已'+(direction>0?'向上':'向下')+'滚动一屏';};
  if(behavior.effect==='无动画'||globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches||!front.animate){finish();return;}
  motionBusy=true;
  const distance=direction>0?'-100%':'100%',incoming=direction>0?'100%':'-100%',axis=behavior.axis==='horizontal'?'X':'Y';
  const timing={duration:behavior.effect==='仿真'?650:420,easing:'cubic-bezier(.2,.7,.3,1)'};
  let animations=[];
  if(!behavior.paged){animations=[front.animate([{transform:'translateY(0)'},{transform:'translateY('+(direction>0?'-70px':'70px')+')'}],timing)];}
  else if(behavior.effect==='仿真'){front.style.transformOrigin=direction>0?'left center':'right center';animations=[front.animate([{transform:'rotateY(0deg)',boxShadow:'0 0 0 #0000'},{transform:'rotateY('+(direction>0?'-145deg':'145deg')+')',boxShadow:'18px 0 35px #0003'}],timing)];}
  else if(behavior.effect==='覆盖'){animations=[back.animate([{transform:'translate'+axis+'('+incoming+')'},{transform:'translate'+axis+'(0)'}],timing)];}
  else {animations=[front.animate([{transform:'translate'+axis+'(0)'},{transform:'translate'+axis+'('+distance+')'}],timing),back.animate([{transform:'translate'+axis+'('+incoming+')'},{transform:'translate'+axis+'(0)'}],timing)];}
  Promise.all(animations.map(a=>a.finished)).then(finish).catch(()=>{if(version===demoVersion)motionBusy=false;});
 }

 const names={overview:'阅读偏好',appearance:'主题与字体',themes:'我的主题库',themeDetail:'主题详情',fonts:'字体管理',layout:'排版与页面',body:'正文排版与边距',margins:'正文排版与边距',headers:'页眉与页脚',title:'章节标题样式',operation:'翻页与手势',content:'正文与段评',rules:'正文样式规则',ruleEdit:'编辑样式规则',comments:'段评与神人评论',bubble:'段尾气泡皮肤',god:'神人评论皮肤'};

 root.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.elementField){const item=currentPageElement();if(!item)return;const key=el.dataset.elementField;let value=el.type==='range'?Number(el.value):el.value;if(key==='width')value=Math.max(15,Math.min(90,Number(value)));if(key==='size')value=Math.max(9,Math.min(22,Number(value)));if(key==='zone'&&!['header','footer'].includes(value))return;if(key==='color'&&!/^#[0-9a-f]{6}$/i.test(value))return;item[key]=value;Object.assign(item,constrainPageElement(item,item.x,item.y));root.querySelectorAll('[data-element-field]').forEach(input=>{if(input.type==='range')input.value=item[input.dataset.elementField];});root.querySelectorAll('[data-element-value]').forEach(output=>output.textContent=item[output.dataset.elementValue]+(output.dataset.elementValue==='size'?' pt':' %'));if(key==='zone'||key==='type')render();else updatePreview();edited();return;}
