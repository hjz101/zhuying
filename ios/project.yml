name: Yueshan
options:
  bundleIdPrefix: com.yueshan
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  Yueshan:
    type: application
    platform: iOS
    info:
      path: Yueshan/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - path: Yueshan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yueshan.reader.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 阅山
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  YueshanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YueshanTests
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  YueshanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YueshanUITests
    dependencies:
      - target: Yueshan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yueshan:
    build:
      targets:
        Yueshan: all
    test:
      gatherCoverageData: true
      targets:
        - YueshanTests
        - YueshanUITests
